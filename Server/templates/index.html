<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Light | Control Center</title>
    <style>
        :root { --neon: #00eaff; --bg: #030305; }
        body {
            background-color: var(--bg); color: white; font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        .container {
            background: rgba(10, 10, 12, 0.8); backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08); padding: 50px;
            border-radius: 45px; width: 480px; text-align: center; /* Збільшено ширину */
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        /* Збільшений статус */
        #statusIndicator {
            margin-bottom: 30px; font-size: 1rem; font-weight: bold;
            letter-spacing: 1px; transition: color 0.3s;
        }
        .online { color: #00ff88; }
        .offline { color: #ff4444; }

        /* Збільшене кільце кольору */
        .picker-wrapper { position: relative; width: 180px; height: 180px; margin: 0 auto 40px; display: flex; justify-content: center; align-items: center;}
        #mainColor { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 10; }
        .color-lens { width: 100%; height: 100%; background: var(--neon); border-radius: 50%; border: 6px solid white; box-shadow: 0 0 50px var(--neon); transition: 0.3s;}

        /* Збільшений повзунок та текст */
        .intensity-label { font-size: 0.8rem; color: #888; letter-spacing: 3px; font-weight: bold; }
        input[type="range"] { width: 100%; margin-top: 15px; accent-color: var(--neon); cursor: pointer; height: 8px; }

        /* Збільшені кнопки */
        .modes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        button {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #eee; padding: 18px; border-radius: 16px; cursor: pointer;
            font-size: 1rem; font-weight: 500; transition: 0.3s;
        }
        button.active { background: var(--neon); color: black; font-weight: bold; box-shadow: 0 0 20px var(--neon); }
    </style>
</head>
<body>

    <div class="container">
        <div id="statusIndicator" class="online">● NUCLEO-F446RE ONLINE</div>

        <div class="picker-wrapper">
            <input type="color" id="mainColor" value="#ff0000">
            <div class="color-lens" id="lens"></div>
        </div>

        <div class="intensity-label">INTENSITY</div>
        <input type="range" id="brightness" min="1" max="10" value="5">

        <div class="modes-grid">
            <button onclick="sendMode('4', this)" class="active">Static White</button>
            <button onclick="sendMode('r', this)">Rainbow</button>
            <button onclick="sendMode('b', this)">Breathing</button>
            <button onclick="sendMode('c', this)">Cosmos</button>
            <button onclick="sendMode('l', this)">Lightning</button>
            <button onclick="sendMode('x', this)">SOS</button>
            <button onclick="sendMode('0', this)" style="grid-column: span 2; color: #ff4444; border-color: rgba(255,68,68,0.3);">POWER OFF</button>
        </div>
    </div>

    <script>
        const colorInput = document.getElementById('mainColor');
        const brightnessInput = document.getElementById('brightness');
        const lens = document.getElementById('lens');
        const statusIndicator = document.getElementById('statusIndicator');

        let currentMode = '4';
        let lastSentTime = 0;
        let lastBrValue = 5;

        // Функція оновлення тексту та кольору статусу
        function setStatus(isOnline) {
            if (isOnline) {
                statusIndicator.className = 'online';
                statusIndicator.innerText = '● NUCLEO-F446RE ONLINE';
            } else {
                statusIndicator.className = 'offline';
                statusIndicator.innerText = '● ОФЛАЙН (ПЛАТА ВІДКЛЮЧЕНА)';
            }
        }

        async function apiSend(cmd) {
            const now = Date.now();
            if (now - lastSentTime < 80) return; // Оптимізований тротлінг
            lastSentTime = now;

            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cmd: cmd + '\n' })
                });

                // Перевіряємо відповідь від Python сервера
                if (response.status === 500) {
                    setStatus(false);
                } else {
                    setStatus(true);
                }
            } catch (e) {
                console.error("Network/UART Error");
                setStatus(false);
            }
        }

        // Періодична перевірка статусу (кожні 3 секунди)
        async function checkStatus() {
            try {
                // Відправляємо порожню команду. Python поверне 400 якщо плата є, і 500 якщо немає
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cmd: '' })
                });
                if (response.status === 500) setStatus(false);
                else setStatus(true);
            } catch (e) {
                setStatus(false); // Якщо сервер Python взагалі впав
            }
        }

        checkStatus(); // Перевіряємо одразу при завантаженні сторінки
        setInterval(checkStatus, 3000); // І далі кожні 3 секунди

        function sendState() {
            const hex = colorInput.value;
            const br = brightnessInput.value / 10;
            const r = Math.round(parseInt(hex.slice(1,3), 16) * br);
            const g = Math.round(parseInt(hex.slice(3,5), 16) * br);
            const b = Math.round(parseInt(hex.slice(5,7), 16) * br);
            apiSend(`R${r}G${g}B${b}`);
        }

        function sendMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            apiSend(mode);
        }

        colorInput.addEventListener('input', () => {
            currentMode = 's'; // Перемикаємо в режим "Палітра"
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            sendState();
            updateUI();
        });

        brightnessInput.addEventListener('input', () => {
            if (currentMode === 's' || currentMode === '4' || currentMode === '0') {
                sendState();
            } else {
                const currentVal = parseInt(brightnessInput.value);
                const diff = currentVal - lastBrValue;

                if (diff !== 0) {
                    let cmdStr = "";
                    let charToSend = diff > 0 ? 'w' : 's';
                    let steps = Math.abs(diff);

                    // Склеюємо команди. Якщо різниця 3 кроки вниз, робимо "s\ns\ns"
                    for (let i = 0; i < steps; i++) {
                        cmdStr += charToSend + (i < steps - 1 ? '\n' : '');
                    }

                    // Відправляємо пакетом прямо на сервер (без затримки apiSend)
                    fetch('/api/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cmd: cmdStr + '\n' })
                    }).catch(e => console.error("UART Error"));

                    lastBrValue = currentVal;
                }
            }
            updateUI();
        });

        function updateUI() {
            const color = colorInput.value;
            document.documentElement.style.setProperty('--neon', color);
            lens.style.boxShadow = `0 0 40px ${color}`;
        }
        updateUI();
    </script>
</body>
</html>
